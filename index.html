<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocktailDM</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest">
    
    <script src="app.js"></script>
</head>
<body>
    <h1>🍹 CocktailDM</h1>

    <div class="mb-3">
      <div class="input-group">
        <input type="text" id="inputNome" class="form-control" placeholder="Es: margarita, mojito..." />
        <button id="execute-btn" class="btn btn-primary">Cerca</button>
      </div>
    </div>

    <p id="errore">❌ Nessun cocktail trovato. Prova con un altro nome!</p>
    
    <p id="contatore"></p>
    
    <div id="risultati"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
